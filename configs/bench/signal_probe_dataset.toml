# Quick signal-probe dataset.
# Uses an existing preprocessed/cached small dataset so benchmark runs do not
# depend on the empty default post_image_dataset/resized path.

[general]
caption_extension = ".txt"
keep_tokens = 3

[[datasets]]
resolution = 1024
batch_size = 1
enable_bucket = true
validation_split_num = 0
validation_seed = 42

  [[datasets.subsets]]
