# gui-methods/lokr.toml — LoKr (Low-Rank Kronecker Product).
#
# LyCORIS-compatible LoKr via Kronecker product decomposition.
# Output is ComfyUI-compatible (lokr_w1/lokr_w2 keys, lycoris.kohya metadata).

network_dim = 32
network_alpha = 32

learning_rate = 1e-4
max_train_epochs = 10
save_every_n_epochs = 5
checkpointing_epochs = 5

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

use_lokr = true
lokr_factor = 8
# Structured einsum keeps the no-kron runtime path while preserving full w2
# capacity by default. Enable lokr_decompose_w2 only for compact low-capacity
# LoKr experiments.
lokr_use_einsum = true
lokr_decompose_w2 = false
# Explicit full-factor declaration. Default lokr_decompose_w2=false already
# keeps full w2; this switch mainly replaces the retired network_dim=114514
# sentinel and stamps ss_lokr_full_factor for save/load.
lokr_full_factor = true
# LoKr custom autograd computes output factors in small groups. Larger values
# reduce repeated projection work but increase temporary activation memory.
# 8 is the current speed recommendation; lower to 4/2 if VRAM is unstable.
lokr_factor_group_size = 8
# Row-chunk byte threshold for custom LoKr projection. Default 4MiB.
lokr_project_chunk_bytes = 4194304
# Fused grouped-delta defaults validated on CMP 170HX. Unsupported devices,
# dtypes, shapes, and layouts fall back to the eager grouped implementation.
lokr_grouped_delta_backend = "triton"
# The full-gradient path passed training/resume/compile/block-swap gates. A
# Triton compilation failure after capability selection still surfaces.
lokr_grouped_delta_backward_backend = "triton_grad_w1_w2_grad_x"

output_name = "anima_lokr"

blocks_to_swap = 0

[variant]
family = "lora"
label = "LoKr"
description = "LyCORIS-compatible Kronecker-product LoRA."
order = 12
