# gui-methods/lokr.toml — LoKr (Low-Rank Kronecker Product).
#
# LyCORIS-compatible LoKr via Kronecker product decomposition.
# Output is ComfyUI-compatible (lokr_w1/lokr_w2 keys, lycoris.kohya metadata).

network_dim = 32
network_alpha = 32

learning_rate = 1e-4
max_train_epochs = 10
save_every_n_epochs = 5
checkpointing_epochs = 5

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

use_lokr = true
lokr_factor = 8
# LoKr custom autograd computes output factors in small groups. Larger values
# reduce repeated projection work but increase temporary activation memory.
# 8 is the current speed recommendation; lower to 4/2 if VRAM is unstable.
lokr_factor_group_size = 8
# Row-chunk byte threshold for custom LoKr projection. Default 4MiB.
lokr_project_chunk_bytes = 4194304

output_name = "anima_lokr"

blocks_to_swap = 0

[variant]
family = "lora"
label = "LoKr"
description = "LyCORIS-compatible Kronecker-product LoRA."
order = 12
