# gui-methods/loha.toml — LoHa (Low-Rank Hadamard Product).
#
# PEFT/LyCORIS-compatible Linear LoHa via Hadamard product decomposition.
# Output uses hada_w1_a/b and hada_w2_a/b tensor keys.
# Status: compatible / non-primary. See docs/methods/loha.md.

network_dim = 32
network_alpha = 32

learning_rate = 8e-5
max_train_epochs = 8
save_every_n_epochs = 4
# Keep at least one resumable checkpoint cadence for short hot tests / demos.
checkpointing_epochs = 1

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

use_loha = true

output_name = "anima_loha"

[variant]
# Keep family=lora so WebUI still lists this under the LoRA-family method group
# (same pattern as lokr/glora/vera). UI method-key inference uses use_loha.
family = "lora"
label = "LoHa"
description = "PEFT/LyCORIS-compatible Hadamard-product LoHa (compatible, non-primary)."
order = 13
