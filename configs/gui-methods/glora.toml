# gui-methods/glora.toml — GLoRA (Generalized LoRA).
#
# LyCORIS/ComfyUI-compatible GLoRA via low-rank input modulation plus a
# low-rank additive B path. Requires GLoRA-aware inference/merge loaders.

network_dim = 32
network_alpha = 32

learning_rate = 1e-4
max_train_epochs = 10
save_every_n_epochs = 5
checkpointing_epochs = 5

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

use_glora = true

output_name = "anima_glora"

blocks_to_swap = 0

[variant]
family = "lora"
label = "GLoRA"
description = "LyCORIS-compatible generalized LoRA."
order = 13
