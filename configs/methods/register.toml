# Register-token adapter on a frozen Anima DiT.

network_module = "networks.methods.register"

network_args = [
    "num_registers=36",
    "arm=B",
    "qkv_mode=lora",
    "insert_block=8",
    "target_blocks=8-18",
    "register_lr_scale=100",
    "init_std=0.02",
]

network_dim = 16
network_alpha = 90

learning_rate = 5e-5
max_train_epochs = 4
save_every_n_epochs = 4
checkpointing_epochs = 4

caption_dropout_rate = 0.1
cache_llm_adapter_outputs = true

blocks_to_swap = 0
torch_compile = false

output_name = "anima_register"
