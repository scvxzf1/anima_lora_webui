# MOSS-Image ordinary T2I plain LoRA v1. Local component directories only.
model_family = "moss_image"
pretrained_model_name_or_path = "models/moss_image/MOSS-Image-DiT"
qwen3 = "models/moss_image/MOSS-Image-TextEncoder-BF16"
vae = "models/moss_image/MOSS-Image-VAE"
moss_te_quantization = "nf4"

network_module = "networks.lora_anima"
network_train_unet_only = true
network_dim = 32
network_alpha = 32
learning_rate = 5e-5
max_train_epochs = 3
output_name = "moss_image_lora"
mixed_precision = "bf16"
base_compute = "bf16"
no_half_vae = true
attn_mode = "torch"
gradient_checkpointing = true
selective_checkpoint = "off"
cpu_offload_checkpointing = false
unsloth_offload_checkpointing = false
torch_compile = false
compile_dynamic_seq = false
compile_seq_bands = false
# Initial tuning point only: 0 disables swapping; valid 0..40, batch size 1.
blocks_to_swap = 20
block_swap_transfer_dtype = "bf16"
block_swap_restore_mode = "foreach"
train_batch_size = 1
use_vae_cache = true
use_text_cache = true
cache_llm_adapter_outputs = false
max_token_length = 4096
caption_dropout_rate = 0.0
use_shuffled_caption_variants = false
weighted_captions = false
masked_loss = false
timestep_sampling = "uniform"
discrete_flow_shift = 1.0
weighting_scheme = "none"
p2_gamma = 0.0
loss_type = "l2"
checkpointing_epochs = 1
checkpointing_last_n_epochs = 2
sample_sampler = "euler"
use_moe_style = false
route_per_layer = false
router_source = "none"
use_ortho = false
use_timestep_mask = false

[[datasets]]
resolution = 1024
batch_size = 1
caption_extension = ".txt"
enable_bucket = true
# NOTE (constant-token buckets): with resolution = 1024 MOSS resolves to the
# canonical 24-entry table via make_constant_token_bucket_resolutions(), which
# early-returns before the min/max filter runs. The three keys below are
# therefore INERT on this path — they encode "allow the whole table"
# (extremes 672/1536) rather than an active constraint.
# They only bind when resolution != 1024 (see moss_image_lora_t768.toml and
# moss_image_lora_t512.toml, which scale all three keys together). Do not
# change resolution alone: it silently collapses the aspect ladder.
min_bucket_reso = 672
max_bucket_reso = 1536
bucket_reso_steps = 64
bucket_no_upscale = true
caption_dropout_rate = 0.0

[[datasets.subsets]]
image_dir = "{resized_image_dir}"
cache_dir = "{lora_cache_dir}"
num_repeats = 1
